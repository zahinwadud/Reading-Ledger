<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Ledger</title>
<meta name="description" content="My personal reading list: books and audiobooks in English and Bengali.">
<script>
  /* Apply the saved light/dark choice before the page paints (avoids a flash). */
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<!-- Installable app: name, icons and colours for the home-screen version -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2226" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>

<header class="top">
  <div class="top-in">
    <!-- Logo: books on a shelf (the same picture as the app icon) -->
    <a class="brand" href="#/" data-home aria-label="Reading Ledger, home">
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect x="4.5" y="8" width="4.5" height="16" rx="1"/><rect x="10" y="11.5" width="4.5" height="12.5" rx="1" opacity=".55"/><rect x="15.5" y="5.5" width="5" height="18.5" rx="1"/><rect x="22" y="9" width="4.5" height="15" rx="1" transform="rotate(13 24.2 24)"/><rect x="3" y="25.5" width="26" height="2" rx="1"/></svg>
    </a>
    <nav class="links" aria-label="Main">
      <!-- The small pictures show only on phones, where these links become a floating bar at the bottom.
           Each link has an outline picture and a solid one; the solid one shows for the page you are on. -->
      <a href="#/" data-nav="home"><svg class="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><svg class="i-solid" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2 3 11h2.2v8.3c0 .4.3.7.7.7H10v-5.5h4V20h4.1c.4 0 .7-.3.7-.7V11H21z"/></svg><span>Home</span></a>
      <a href="#/all" data-nav="books"><svg class="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6C9.800 4.500 6.500 4.200 3.500 5v13c3-.800 6.300-.500 8.500 1"/><path d="M12 6c2.200-1.500 5.500-1.800 8.500-1v13c-3-.800-6.300-.500-8.500 1"/><path d="M12 6v13"/></svg><svg class="i-solid" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.2 6.3C9 5 6.2 4.7 3.6 5.3c-.4.1-.6.4-.6.8v11.6c0 .5.5.9 1 .8 2.5-.5 5.1-.2 7.2 1z"/><path d="M12.8 6.3c2.2-1.3 5-1.6 7.6-1 .4.1.6.4.6.8v11.600c0 .5-.5.9-1 .8-2.5-.5-5.1-.2-7.2 1z"/></svg><span>Books</span></a>
      <a href="#/comics" data-nav="comics"><svg class="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11h-9l-4 3.500V16H4z"/><path d="M8.500 9.500h7M8.500 12.500h4"/></svg><svg class="i-solid" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4.500h16c.6 0 1 .4 1 1V16c0 .6-.4 1-1 1h-8.600L7 20.500V17H4c-.6 0-1-.4-1-1V5.500c0-.6.4-1 1-1z"/><path d="M8 9.500h8M8 12.500h5" fill="none" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round"/></svg><span>Comics</span></a>
      <a href="#/stats" data-nav="stats"><svg class="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><svg class="i-solid" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.5" y="10" width="4.2" height="10" rx="1.2"/><rect x="9.9" y="4" width="4.2" height="16" rx="1.2"/><rect x="16.3" y="13" width="4.2" height="7" rx="1.2"/></svg><span>Stats</span></a>
    </nav>
    <!-- Search is an icon until clicked, then it expands into a field -->
    <div class="search-wrap" id="sw">
      <button id="search-btn" class="icon-btn" type="button" aria-label="Search" aria-expanded="false" aria-controls="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <input id="q" class="search" type="search" placeholder="Search title or author · বই বা লেখক"
             aria-label="Search by title or author" autocomplete="off">
    </div>
    <!-- Light / dark: shows a sun in light mode and a moon in dark mode -->
    <button id="theme" class="icon-btn theme-btn" type="button" aria-label="Dark mode" aria-pressed="false">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <!-- Owner dashboard (login required) -->
    <a class="avatar-btn" href="admin.html" aria-label="Owner dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.6-4 3.7-6.5 7.5-6.5s6.9 2.5 7.5 6.5"/></svg>
    </a>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<noscript><p class="state">This site needs JavaScript to show the bookshelf.</p></noscript>
<script type="module" src="js/public.js"></script>
</body>
</html>
