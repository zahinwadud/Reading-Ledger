<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Ledger</title>
<meta name="description" content="My personal reading list: books and audiobooks in English and Bengali.">
<script>
  /* Apply the saved light/dark choice before the page paints (avoids a flash). */
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>

<header class="top">
  <div class="top-in">
    <!-- Simple line logo: an open book -->
    <a class="brand" href="#/" data-home aria-label="Reading Ledger, home">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8C13 6 8 5.5 4 6.5V24c4-1 9-.5 12 2"/><path d="M16 8c3-2 8-2.5 12-1.5V24c-4-1-9-.5-12 2"/><path d="M16 8v18"/></svg>
    </a>
    <nav class="links" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/all" data-nav="books">Books</a>
    </nav>
    <!-- Search is an icon until clicked, then it expands into a field -->
    <div class="search-wrap" id="sw">
      <button id="search-btn" class="icon-btn" type="button" aria-label="Search" aria-expanded="false" aria-controls="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <input id="q" class="search" type="search" placeholder="Search title or author · বই বা লেখক"
             aria-label="Search by title or author" autocomplete="off">
    </div>
    <!-- Light / dark: shows a sun in light mode and a moon in dark mode -->
    <button id="theme" class="icon-btn theme-btn" type="button" aria-label="Dark mode" aria-pressed="false">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <!-- Owner dashboard (login required) -->
    <a class="avatar-btn" href="admin.html" aria-label="Owner dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.6-4 3.7-6.5 7.5-6.5s6.9 2.5 7.5 6.5"/></svg>
    </a>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<noscript><p class="state">This site needs JavaScript to show the bookshelf.</p></noscript>
<script type="module" src="js/public.js"></script>
</body>
</html>
